<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyPulse</title>
<meta name="theme-color" content="#060A14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: operations console — slim icon rail, command bar with global search + live status,
   12-col overview: map (8) + alerts column (4), 24h timeline under map, trip/business/Telegram row, world strip. */
:root{
  --bg:#060A14; --surface:#0B1222; --surface-2:#101A2E; --raise:#142038; --line:rgba(148,170,220,.12); --line-2:rgba(148,170,220,.2);
  --fg:#E6ECF7; --muted:#8C99B5; --dim:#5E6B88;
  --accent:#38BDF8; --accent-2:#3B82F6;
  --y:#F5B83D; --o:#F97316; --r:#EF4444; --ok:#34D399;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --radius:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
h2{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:.8rem}.grow{flex:1}
[hidden]{display:none!important}

/* Command bar */
.top{position:sticky;top:0;z-index:50;height:56px;display:flex;gap:14px;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top,0px);background:rgba(6,10,20,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:1rem;white-space:nowrap;letter-spacing:-.01em}
.brand svg{width:24px;height:24px}
.search{position:relative;flex:1;max-width:560px;min-width:0;margin:0 auto}
.search input{width:100%;height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px 0 34px;background:var(--surface);color:var(--fg)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 24px 48px rgba(0,0,0,.5);overflow:hidden;z-index:60}
.results button{display:block;width:100%;text-align:left;padding:10px 14px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus{background:var(--raise)}
.status{display:flex;gap:8px;align-items:center}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.stat i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.stat.off i{background:var(--dim);box-shadow:none}
@media (max-width:760px){.status{display:none}}
.lang{background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:10px;height:36px;padding:0 8px}

/* Shell */
.shell{display:flex}
.rail{display:none}
main{flex:1;min-width:0;padding:16px;padding-block:14px 96px;width:100%;max-width:1480px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,18,34,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;color:var(--dim);cursor:pointer;border-radius:10px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
@media (min-width:900px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:2px;width:84px;padding:12px 8px;position:sticky;top:56px;height:calc(100vh - 56px);border-right:1px solid var(--line)}
  .rail .tab{padding:10px 2px;font-size:.66rem;gap:5px}
  .rail .tab:hover{background:var(--surface)}
  .rail .tab[aria-current="page"]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
  main{padding:18px 20px 32px}
}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.grid.two{grid-template-columns:1.2fr 1fr}}
.grid>*,.stack>*{min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Source tags */
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font:600 .6rem/1 var(--mono);letter-spacing:.06em;border:1px solid;white-space:nowrap;vertical-align:middle}
.tag-official{color:#E6ECF7;border-color:rgba(230,236,247,.4)}
.tag-forecast{color:var(--accent);border-color:rgba(56,189,248,.4)}
.tag-observed{color:#A5B4FC;border-color:rgba(165,180,252,.4)}
.tag-skypulse{color:#0B1222;background:var(--accent);border-color:var(--accent)}

/* Overview grid */
.ov{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.ov>*{min-width:0;grid-column:1/-1}
.ov-map{position:relative}
#miniMap{height:58vh;min-height:360px;max-height:640px}
@media (min-width:1100px){
  .ov-map{grid-column:1/9;grid-row:1}
  .alerts-col{grid-column:9/13;grid-row:1/3;display:flex;flex-direction:column}
  .ov-tl{grid-column:1/9;grid-row:2}
  .ov-trip{grid-column:1/5}.ov-biz{grid-column:5/9}.ov-tg{grid-column:9/13}
  .ov-world{grid-column:1/13}
  .alerts-col .alerts{flex:1;overflow:auto;max-height:820px}
}
@media (min-width:700px) and (max-width:1099px){.ov-trip{grid-column:1/7}.ov-biz{grid-column:7/13}}

/* Location card (floats over the map on desktop, sits under it on mobile) */
.loc{background:rgba(11,18,34,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:14px 16px}
@media (min-width:900px){.loc{position:absolute;z-index:500;left:14px;top:14px;width:340px;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.45)}}
.loc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loc-name{font-size:1.15rem;font-weight:600;letter-spacing:-.015em}
.loc-sub{font-size:.78rem;color:var(--muted)}
.loc-now{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.loc-ic .wi{width:44px;height:44px}
.loc-t{font-size:3rem;font-weight:500;line-height:1;letter-spacing:-.05em}
.loc-c{font-weight:500}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.kv>div{background:var(--surface);padding:7px 9px}
.kv dt,.kv3 dt,.trip-sum dt{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.kv dd,.kv3 dd,.trip-sum dd{margin:2px 0 0;font-size:.95rem}
.kv small{color:var(--muted);font-size:.68rem}
.loc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.loc-act{display:flex;gap:6px;align-items:center}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:8px;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:15px;height:15px}.icon-btn:hover{color:var(--fg);border-color:var(--muted)}

/* Map chrome */
.map-ctl{position:absolute;z-index:500;top:14px;right:14px;display:flex;background:rgba(11,18,34,.9);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(10px)}
.ltog{border:0;border-radius:7px;padding:6px 10px;font-size:.74rem;font-weight:500;cursor:pointer;background:none;color:var(--muted)}
.ltog[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.map-legend{position:absolute;z-index:500;left:14px;bottom:14px;display:flex;gap:14px;align-items:center;background:rgba(11,18,34,.86);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.72rem}
@media (max-width:899px){.ov-map .map-legend{bottom:auto;top:58px;left:14px}.map-ctl{left:14px;right:auto}}
.tscale{position:relative;padding-top:13px}
.tscale i{display:block;width:150px;height:6px;border-radius:3px;background:linear-gradient(90deg,#818CF8,#60A5FA,#38BDF8,#2DD4BF,#FACC15,#FB923C,#EF4444)}
.tscale em{position:absolute;top:-1px;font-style:normal;font-size:.62rem;color:var(--muted)}
.tscale em:nth-of-type(1){left:0}.tscale em:nth-of-type(2){left:28%}.tscale em:nth-of-type(3){left:56%}.tscale em:nth-of-type(4){left:86%}
.lg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.pin{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:3px 8px 3px 6px;border-radius:6px;background:rgba(11,18,34,.92);border:1px solid var(--line-2);color:var(--fg);font:500 11px/1.3 var(--body);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pin i{width:7px;height:7px;border-radius:50%}
.pin span{color:var(--muted)}
.pin.me{border-color:var(--accent);font-size:12.5px;padding:5px 10px 5px 8px;box-shadow:0 0 0 4px rgba(56,189,248,.18),0 6px 16px rgba(0,0,0,.5)}
.pin.me span{color:var(--fg)}
.live-dot{transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:rgba(56,189,248,.25);display:grid;place-items:center;animation:pulse 2s infinite}
.live-dot i{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}70%{box-shadow:0 0 0 14px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
.live-badge{display:inline-flex;align-items:center;gap:6px;font:600 .66rem var(--mono);letter-spacing:.08em;color:var(--accent)}
.live-badge i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.map-full{position:relative}
#map{height:calc(100vh - 210px);min-height:420px}
#tripMap{height:340px;border-radius:10px;margin:12px 0;border:1px solid var(--line)}

/* Alerts */
.sevbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sevbar span{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column}
.sevbar b{font-size:1.4rem;font-weight:500;color:var(--fg);line-height:1.1}
.sevbar .s3{box-shadow:inset 0 2px 0 var(--r)}.sevbar .s2{box-shadow:inset 0 2px 0 var(--o)}.sevbar .s1{box-shadow:inset 0 2px 0 var(--y)}
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .sev{align-self:stretch;border-radius:2px;background:var(--dim)}
.alert.l1 .sev{background:var(--y)}.alert.l2 .sev{background:var(--o)}.alert.l3 .sev{background:var(--r)}
.a-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-top b{font-weight:500}
.a-meta{font-size:.76rem;color:var(--muted);margin-top:2px}
.lvl{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:.66rem;font-weight:600;letter-spacing:.03em;white-space:nowrap;background:rgba(52,211,153,.12);color:var(--ok)}
.lvl.l1{background:rgba(245,184,61,.14);color:var(--y)}.lvl.l2{background:rgba(249,115,22,.16);color:var(--o)}.lvl.l3{background:rgba(239,68,68,.16);color:#FCA5A5}
.empty{padding:14px 0;color:var(--muted);font-size:.85rem}
.legend-def{display:grid;gap:8px;margin-top:14px;font-size:.78rem;color:var(--muted)}
@media (min-width:760px){.legend-def{grid-template-columns:1fr 1fr}}

/* Timeline */
.legend-inline{display:flex;gap:12px;align-items:center;font-size:.72rem;color:var(--muted)}
.legend-inline span{display:inline-flex;gap:5px;align-items:center}
.lk-t{width:12px;height:2px;background:var(--accent)}.lk-p{width:8px;height:8px;background:rgba(59,130,246,.55);border-radius:2px}
.tl-wrap{overflow-x:auto}
.tl{width:100%;min-width:620px;height:auto;display:block}
.tl .gl{stroke:var(--line);stroke-width:1}
.tl .axis{fill:var(--dim);font:500 10.5px var(--mono)}
.tl .tval{fill:var(--fg);font:500 11px var(--mono)}
.tl .tline{fill:none;stroke:var(--accent);stroke-width:2}
.tl .pbar{fill:rgba(59,130,246,.45)}
.tl .dot{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.tl .dotnow{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.tl .nowline{stroke:var(--accent);stroke-opacity:.35;stroke-dasharray:2 3}
.days{display:grid;grid-template-columns:repeat(7,minmax(70px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.day{background:var(--surface);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem}
.day .d{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .wi{width:26px;height:26px}
.day em{font-style:normal;color:var(--dim)}.day .pr{font-size:.68rem;color:var(--accent)}
@media (max-width:640px){.days{grid-template-columns:repeat(7,74px);overflow-x:auto}}
.wi{width:24px;height:24px;flex:0 0 auto}

/* Trip / business / Telegram cards */
.route{display:flex;align-items:center;gap:10px;font-weight:500;margin-bottom:10px}
.route i{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 10px)}
.kv3,.trip-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trip-sum{grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:4px}
@media (max-width:560px){.trip-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv3 dd{font-size:.85rem}
.trip-risk{margin-top:10px;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.biz-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{font-size:.72rem;border:1px solid var(--line-2);border-radius:99px;padding:2px 9px}
.biz-i{font-size:.82rem;padding:7px 0 7px 10px;border-left:2px solid var(--y);margin-top:6px;color:var(--muted)}
.biz-i b{color:var(--fg);font-weight:500}.biz-i.l2{border-color:var(--o)}.biz-i.l3{border-color:var(--r)}
.tg-row{display:flex;gap:12px;align-items:flex-start}
.tg-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--dim)}
.tg-dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.world{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.city{flex:0 0 132px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.city:hover{border-color:var(--line-2);background:var(--raise)}
.city-n{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city-r{display:flex;align-items:center;justify-content:space-between}
.city-r b{font-size:1.25rem;font-weight:500}
.city.skel{height:62px}

/* Business */
.biz-hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:inset 3px 0 0 var(--ok)}
.biz-hero.b1{box-shadow:inset 3px 0 0 var(--y)}.biz-hero.b2{box-shadow:inset 3px 0 0 var(--r)}
.bh-v{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin:4px 0}
.bh-dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.b1 .bh-dot{background:var(--y)}.b2 .bh-dot{background:var(--r)}
.bh-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bh-r .wi{width:40px;height:40px}
.bh-msgs{grid-column:1/-1}
.bidx{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500}
.bidx::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.bidx.b1::before{background:var(--y)}.bidx.b2::before{background:var(--r)}
.gbar{display:inline-block;width:60px;height:5px;border-radius:3px;background:var(--line);margin-right:8px;vertical-align:middle;overflow:hidden}
.gbar i{display:block;height:100%}
.loc-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons & forms */
.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.85rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121F}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.form{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.form.cols{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.field label,.label{font-size:.68rem;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.field input,.field select{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:9px 11px;width:100%;color-scheme:dark}
.inrow{display:flex;gap:6px}.inrow input{flex:1;min-width:0}
.field .results{top:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font-size:.8rem;cursor:pointer}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:7px 10px;cursor:pointer;border-radius:7px;font-weight:500;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600}
.sev-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.route-tbl .wi,.biz-tbl .wi{width:22px;height:22px}

/* Legacy pieces still used by other views */
.risk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--y);background:var(--surface-2)}
.risk.l2{box-shadow:inset 3px 0 0 var(--o)}.risk.l3{box-shadow:inset 3px 0 0 var(--r)}
.chip{display:inline-block;font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:rgba(245,184,61,.14);color:var(--y)}
.chip.l2{background:rgba(249,115,22,.16);color:var(--o)}.chip.l3{background:rgba(239,68,68,.16);color:#FCA5A5}
.chip.ok{background:rgba(52,211,153,.14);color:var(--ok)}.chip.off{background:var(--raise);color:var(--muted)}
.risk-list{display:flex;flex-direction:column;gap:8px}
.note{font-size:.74rem;color:var(--dim);margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.info{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.okbox{padding:10px 12px;border-radius:10px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);font-size:.84rem}
.mag{flex:0 0 auto;min-width:38px;text-align:center;font-family:var(--mono);font-weight:600;color:#06121F;background:var(--mc);border-radius:6px;padding:3px 6px}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row .main{min-width:0}

/* Promo */
.promos{display:grid;gap:10px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:640px){.promos{grid-template-columns:1fr 1fr}}
.promo{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:.78rem;color:var(--dim);text-decoration:none}
.promo b{color:var(--muted);font-weight:600}
.footer{font-size:.7rem;color:var(--dim);margin-top:12px}

/* Modal, toast, misc */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.sheet h2{font-size:1rem;letter-spacing:0;text-transform:none;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--raise);border:1px solid var(--line-2);color:var(--fg);padding:9px 14px;border-radius:10px;z-index:1200;font-size:.85rem}
.banner{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.35);border-radius:10px;padding:8px 12px;font-size:.82rem;margin-bottom:12px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--raise),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite;margin:6px 0}
@keyframes sh{to{background-position:-200% 0}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.skel,.live-dot,.live-badge i{animation:none}}
.code{font-family:var(--mono);font-size:.78rem;word-break:break-all;background:var(--bg);border:1px solid var(--line);padding:8px;border-radius:8px}

/* Leaflet theming (on top of leaflet.css) */
.leaflet-container{background:#0A1020!important;font:12px/1.4 var(--body)!important}
.leaflet-bar{border:1px solid var(--line-2)!important;border-radius:9px!important;overflow:hidden;box-shadow:none!important}
.leaflet-bar a{background:rgba(11,18,34,.92)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important}
.leaflet-control-attribution{background:rgba(6,10,20,.7)!important;color:var(--dim)!important;font-size:9.5px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface-2)!important;color:var(--fg)!important;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5)!important}
.leaflet-popup-content-wrapper{border-radius:10px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)!important}
.field .checks label{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:500;color:var(--fg)}
.biz-tbl{min-width:600px}.route-tbl{min-width:640px}
@media (max-width:640px){.biz-hero{grid-template-columns:1fr}.bh-r{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:8px 12px}.bh-v{font-size:1.2rem}}

/* Persistent location bar */
.locbar{position:sticky;top:56px;z-index:45;background:rgba(8,13,26,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.lb-in{display:flex;align-items:center;gap:14px;padding:8px 16px;max-width:1580px;margin:0 auto;min-height:48px}
.lb-pin svg{width:16px;height:16px;color:var(--accent)}
.lb-name{display:flex;align-items:baseline;gap:8px;min-width:0}.lb-name b{font-size:1rem;white-space:nowrap}.lb-name .muted{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-wx{display:flex;align-items:center;gap:6px;padding-left:14px;border-left:1px solid var(--line)}.lb-wx b{font-size:1.05rem;font-weight:500}.lb-c{font-size:.8rem}
.lb-m{display:flex;gap:14px;font-size:.74rem;padding-left:14px;border-left:1px solid var(--line)}
.lb-act{margin-left:auto;display:flex;gap:6px}
@media (max-width:899px){.lb-m,.lb-c,.lb-name .muted{display:none}.lb-act .btn.primary{display:none}.lb-in{gap:10px;padding:6px 16px}}
@media (min-width:900px){.rail{top:104px;height:calc(100vh - 104px)}}
/* Intro / entry screen */
.intro{position:fixed;inset:0;z-index:2000;overflow:auto;padding:24px 16px;display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(900px 500px at 70% 10%,rgba(56,189,248,.16),transparent 60%),radial-gradient(700px 500px at 10% 90%,rgba(59,130,246,.14),transparent 60%),
  repeating-linear-gradient(0deg,rgba(148,170,220,.05) 0 1px,transparent 1px 48px),repeating-linear-gradient(90deg,rgba(148,170,220,.05) 0 1px,transparent 1px 48px),var(--bg)}
.intro-in{width:100%;max-width:760px;padding-block:6vh 40px;display:flex;flex-direction:column;gap:18px}
.intro-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}.intro-brand svg{width:30px;height:30px}
.intro h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.035em;font-weight:600}
.intro-p{color:var(--muted);font-size:1.02rem;max-width:58ch;margin:0}
.intro-search{max-width:none;margin:0}.intro-search input{height:52px;font-size:1.02rem;border-radius:12px;padding-left:42px}.intro-search svg{left:15px;width:18px;height:18px}
.intro-row{display:flex;gap:8px;flex-wrap:wrap}.intro-row .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px}.intro-row svg{width:16px;height:16px}
.intro-picks>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ichip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.84rem}.ichip:hover{border-color:var(--accent);color:var(--accent)}
.intro-feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
@media (min-width:700px){.intro-feats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.intro-feats div{background:rgba(11,18,34,.92);padding:12px;display:flex;flex-direction:column;gap:3px}.intro-feats b{font-size:.86rem;font-weight:600}.intro-feats span{font-size:.76rem;color:var(--muted)}
.intro-lang{display:flex;gap:4px}.intro-lang button{border:1px solid var(--line);background:none;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.78rem}.intro-lang button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
/* Partner promos */
.promos{grid-template-columns:1fr}
@media (min-width:900px){.promos{grid-template-columns:1.4fr 1fr}}
.promo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;background:var(--surface);color:var(--muted)}
.promo-b{font:600 .6rem/1 var(--mono);letter-spacing:.08em;padding:4px 6px;border-radius:4px;color:#0B1222;background:var(--y)}
.promo-course .promo-b{background:var(--accent)}
.promo-t{display:flex;flex-direction:column;gap:1px;min-width:0}.promo-t b{color:var(--fg)}.promo-t span{font-size:.78rem}
.promo-l{font-size:.76rem;color:var(--accent);white-space:nowrap}
a.promo:hover{border-color:var(--line-2)}

.share-btn{display:inline-flex;align-items:center;gap:6px}.share-btn svg{width:14px;height:14px}
@media (max-width:899px){.share-btn span{display:none}}
.share-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.share-b{display:flex;align-items:center;justify-content:center;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:500;font-size:.86rem;box-shadow:inset 0 -2px 0 var(--c,var(--accent))}
.share-b:hover{background:var(--raise)}
.share-b.wa{--c:#25D366}.share-b.tg{--c:#2AABEE}.share-b.fb{--c:#1877F2}.share-b.x{--c:#E6ECF7}.share-b.li{--c:#0A66C2}.share-b.em{--c:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0B1222" stroke="rgba(148,170,220,.3)"/><path d="M6 18h5l3-7 4 12 3-8 2 3h3" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SkyPulse</span></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" aria-label="Search">
    <div class="results" id="qres" hidden></div>
  </div>
  <div class="status"><span class="stat" id="stLive"><i></i>LIVE · Open-Meteo</span><span class="stat off" id="stTg"><i></i>Telegram</span></div>
  <select class="lang" id="lang" aria-label="Language"><option value="az">AZ</option><option value="en">EN</option><option value="ru">RU</option></select>
</header>
<div class="locbar" id="locbar"></div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div id="intro" class="intro" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="tech.js"></script>
<script src="app.js"></script>
</body>
</html>
